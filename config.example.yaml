server:
  api_addr: ":8080"
  radius_addr: ":1812"
  # Drop new packets while this many RADIUS requests are being processed.
  radius_max_concurrent_requests: 64

api:
  # Leave empty to disable API source protection.
  allowed_sources: []
  # Replace with exact IP addresses or CIDR ranges to enable it:
  #   - "127.0.0.1"
  #   - "10.0.0.0/8"
  # Add reverse proxy IP addresses or CIDR ranges here to trust
  # X-Forwarded-For and X-Real-IP from those proxies only.
  trusted_proxies: []
  # For example:
  #   - "127.0.0.1"

database:
  path: "data/radius-go.db"

logging:
  level: "info"
  file: "logs/radius-go.log"
  rotate_daily: true
  max_size_mb: 100
  max_backups: 14
  max_age_days: 30
  compress: true

security:
  bcrypt_cost: 12

clients:
  - name: "local-test-client"
    network: "127.0.0.1/32"
    secret: "replace-with-a-long-random-shared-secret"
